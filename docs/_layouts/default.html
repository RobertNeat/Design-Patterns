<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} &middot; {% endif %}{{ site.title }}</title>
  <link rel="icon" href="{{ '/assets/img/logo.png' | relative_url }}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ '/assets/css/style.css' | relative_url }}" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

  <nav class="navbar navbar-dp navbar-expand-lg">
    <div class="container-fluid">
      <a class="navbar-brand d-flex align-items-center" href="{{ '/' | relative_url }}">
        <img src="{{ '/assets/img/logo.png' | relative_url }}" alt="Design Patterns logo">
        {{ site.title }}
      </a>
      <a class="btn btn-outline-light btn-sm" href="https://github.com/{{ site.github_username | default: 'RobertNeat' }}/Design-Patterns" target="_blank" rel="noopener">
        GitHub
      </a>
    </div>
  </nav>

  <div class="container-fluid flex-grow-1">
    <div class="row">
      <div class="col-lg-3 col-xl-2 px-0">
        {% include sidebar.html %}
      </div>
      <main class="col-lg-9 col-xl-10 py-4 px-4">
        {{ content }}
      </main>
    </div>
  </div>

  <footer class="text-center py-3 mt-auto">
    <small>Design Patterns &middot; wzorce projektowe GoF na przykładzie restauracji</small>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
